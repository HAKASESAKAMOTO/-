<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>API Key 设置 · 层叠生活态</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #e8e3d5; background: #080c13; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 520px; margin: 10vh auto; padding: 24px; }
    h1 { margin: 0 0 12px; font-size: 26px; font-weight: 600; }
    p { color: #b7b5af; font-size: 14px; line-height: 1.7; }
    form { margin-top: 32px; }
    label { display: block; margin: 22px 0 8px; font-size: 15px; }
    input { width: 100%; min-height: 46px; border: 1px solid #62666e; border-radius: 5px; background: #111722; color: #e8e3d5; padding: 12px; font: inherit; }
    input::placeholder { color: #a9adb5; }
    input:focus-visible, button:focus-visible { outline: 2px solid #e8c789; outline-offset: 3px; }
    button { margin-top: 28px; min-height: 44px; padding: 10px 26px; border: 0; border-radius: 5px; background: #e8c789; color: #12161b; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #f2d7a4; }
    button:disabled { opacity: .65; cursor: wait; }
    #status { min-height: 48px; margin-top: 14px; }
    #status.error { color: #ffb4a8; }
    @media (max-width: 520px) { main { margin: 32px auto; } }
  </style>
</head>
<body>
<main>
  <h1>API Key 设置</h1>
  <p id="hint">留空保留已保存的 Key。保存后，下次调用生效。</p>
  <form aria-describedby="hint">
    <label for="deepseek">DeepSeek API Key</label>
    <input id="deepseek" name="DEEPSEEK_API_KEY" type="password" maxlength="4096" autocomplete="off" spellcheck="false" placeholder="加载中…">
    <label for="rodin">Rodin API Key</label>
    <input id="rodin" name="RODIN_API_KEY" type="password" maxlength="4096" autocomplete="off" spellcheck="false" placeholder="加载中…">
    <label for="qwen">Qwen（通义千问）API Key</label>
    <input id="qwen" name="QWEN_API_KEY" type="password" maxlength="4096" autocomplete="off" spellcheck="false" placeholder="加载中…">
    <button type="submit" disabled>保存</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
  const form = document.querySelector('form'), button = document.querySelector('button'), status = document.querySelector('#status');
  const inputs = [...form.querySelectorAll('input')];
  function message(text, error = false) { status.textContent = text; status.classList.toggle('error', error); }
  function refresh(data) { for (const input of inputs) input.placeholder = data.configured[input.name] ? '已保存 · 输入新 Key 可替换' : '尚未配置'; }
  async function request(options) {
    const response = await fetch('/api/provider-keys', { cache: 'no-store', ...options });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || '无法连接配置服务，请确认已启动新版程序。');
    return data;
  }
  request().then(data => { refresh(data); button.disabled = false; }).catch(error => message(error.message, true));
  form.addEventListener('submit', async event => {
    event.preventDefault(); button.disabled = true; message('正在保存…');
    try {
      const data = await request({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(inputs.map(input => [input.name, input.value.trim()]))) });
      refresh(data); form.reset(); message('已保存。下次调用将使用新 Key。');
    } catch (error) { message(error.message || '保存失败，请重试。', true); }
    finally { button.disabled = false; }
  });
</script>
</body>
</html>
